async function printDesign(id){const d=getDesign(id);if(!d||!saveInlineNotes())return;renderPrint(getDesign(id));if(nativeApp()){try{const html='<!doctype html><html><head><meta charset="utf-8"><style>'+document.querySelector('head style').textContent+'</style></head><body><div id="print-root" class="print-root '+($('#print-root').classList.contains('dense')?'dense':'')+'">'+$('#print-root').innerHTML+'</div></body></html>';await window.EmbroideryNative.print({html,name:d.code+' · '+d.name})}catch(err){toast('Print could not open: '+err.message,'error')}return}window.print()}
function openColorDetails(key){const c=allColors().find(c=>c.key===key);if(!c)return;openModal({title:'Thread reference',className:'sheet',body:`<div class="color-sheet-header"><span class="color-sheet-swatch" style="background:${c.hex};color:${foreground(c.hex)}">${icon('spool')}</span><div><h3>${e(c.name)}</h3><p>${e(c.code||'No code')} · ${e(c.hex.toUpperCase())}</p></div></div><div class="row between"><h3 style="font-size:13px">Used in ${c.designs.size} design${c.designs.size===1?'':'s'}</h3>${c.customIds.length?'<span class="pill sky">Custom reference</span>':''}</div><div class="used-design-list">${c.designs.size?[...c.designs.values()].map(({design:d,locations})=>`<button class="used-design-row" data-modal="open-design" data-id="${e(d.id)}">${photoSafe(d.photoBase64)?`<img src="${d.photoBase64}" alt="">`:`<span class="summary-icon">${icon('needle')}</span>`}<span class="grow"><strong>${e(d.name)}</strong><small>${e(d.code)} · ${e(locations.slice(0,3).join(', '))}${locations.length>3?'…':''}</small></span>${icon('chevron')}</button>`).join(''):'<p class="modal-description" style="padding:15px 0 0">This custom reference isn’t assigned to a design yet. Type its name in a thread color row to fill its code and swatch.</p>'}</div><p class="field-hint">Screens cannot accurately reproduce physical thread colors. Verify with your thread chart.</p>${c.customIds.length?'<button class="btn btn-danger btn-sm" style="width:100%;margin-top:18px" data-modal="remove-custom">Remove custom reference</button>':''}`,actions:{'open-design':button=>{const id=button.dataset.id;closeModal();go(`/design/${encodeURIComponent(id)}`)},'remove-custom':async()=>{closeModal();if(!await confirmDialog('Remove this custom color?','This removes the custom library entry only. Thread colors saved in designs stay unchanged.','Remove reference',true))return;if(persistPatch({colors:state.colors.filter(x=>!c.customIds.includes(x.id))})){render(true);toast(saveText('Custom color reference removed.'))}}}})}
function addCustomColor(){openModal({title:t('addColor'),body:`<p class="modal-description">Create a reusable thread reference. Enter this name in a thread color row to fill its saved code and swatch. No physical needle is required.</p><div class="form-field"><label class="field-label" for="custom-color-name">${e(t('colorName'))}<span class="required">*</span></label><input id="custom-color-name" style="width:100%" maxlength="150" placeholder="e.g. Champagne Gold" required autofocus></div><div class="form-grid" style="align-items:end;margin-top:17px"><div class="form-field" style="margin:0"><label class="field-label" for="custom-color-code">${e(t('colorCode'))}<span class="required">*</span></label><input id="custom-color-code" maxlength="80" placeholder="e.g. 1024" required></div><div class="form-field" style="margin:0"><label class="field-label" for="custom-color-hex">${e(t('color'))}</label><div class="row"><input id="custom-color-hex" type="color" value="#C6A15B"><span class="mono muted" id="custom-hex-label">#C6A15B</span></div></div></div><p id="custom-color-error" class="field-error" role="alert"></p>`,footer:`<button class="btn btn-outline" data-modal="close">${e(t('cancel'))}</button><button class="btn btn-primary" data-modal="save">${icon('check','icon-sm')}Save color</button>`,kind:'color',actions:{save:()=>{const name=$('#custom-color-name').value.trim(),code=$('#custom-color-code').value.trim(),hex=$('#custom-color-hex').value.toUpperCase();if(!name||!code){$('#custom-color-error').textContent='Enter both a color name and code.';(!name?$('#custom-color-name'):$('#custom-color-code')).focus();return}const c={id:uuid(),name,code,hex};if(state.colors.some(x=>colorKey(x)===colorKey(c))){$('#custom-color-error').textContent='This code and swatch already exist in your custom library.';return}if(persistPatch({colors:[...state.colors,c]})){closeModal();render(true);toast(saveText('Custom color added.'))}}}})}
async function exportAll(){if(state.problem){await exportRecovery();return}const stamp=now(),settings={...state.settings,lastBackupAt:stamp};const content=JSON.stringify(backupData(state.designs,state.colors,settings),null,2);if(await downloadFile(`EmbroideryGuide-backup-${stamp.slice(0,10)}.json`,content)){persistPatch({settings});if(state.route.view==='settings')render(true);toast(nativeApp()?'Backup opened in the Android share sheet. Choose where to save or send it.':'Complete JSON backup prepared for download.')}}
async function exportRecovery(){const values={};for(const[k,v]of Object.entries(KEYS))try{values[k]=localStorage.getItem(v)}catch{values[k]=null}if(await downloadFile(`EmbroideryGuide-recovery-${now().slice(0,10)}.json`,JSON.stringify({format:'EmbroideryGuideRecovery',version:1,exportedAt:now(),rawLocalStorage:values,sessionData:{designs:state.designs,colors:state.colors,settings:state.settings,editorDraft:state.editor?.dirty?state.editor.design:null,unsavedNote:$('#inline-notes')?{designId:$('#inline-notes').dataset.id,text:$('#inline-notes').value}:null}},null,2)))toast('Recovery file prepared. Raw saved values are preserved. Free storage or restore a valid backup.')}
async function importFile(file){if(!file)return;$('#import-file').value='';if(file.size>20*1024*1024){toast('This backup is too large. Choose a JSON file under 20 MB.','error');return}let data;try{const raw=JSON.parse(await file.text());if(Array.isArray(raw))data={designs:normalizeDesignList(raw),colors:[],settings:state.settings};else{if(!raw||typeof raw!=='object'||raw.format&&raw.format!=='EmbroideryGuide')throw Error('This is not an EmbroideryGuide backup.');if(raw.version!==undefined&&raw.version!==1)throw Error('Unsupported backup version. Use a version 1 backup.');if(!Array.isArray(raw.designs))throw Error('No design array was found in this backup.');data={designs:normalizeDesignList(raw.designs),colors:normalizeColors(raw.colors||[]),settings:normalizeSettings(raw.settings||state.settings)}}}catch(err){toast(`Backup not imported. ${err.message}`,'error');return}
 openModal({title:'Restore your workspace',className:'wide',body:`<p class="modal-description">Backup checked: <strong>${e(file.name)}</strong>. Nothing changes until you confirm.</p><div class="import-summary"><div><strong>${data.designs.length}</strong><span>Designs + photos</span></div><div><strong>${data.colors.length}</strong><span>Custom colors</span></div><div><strong>${data.designs.reduce((n,d)=>n+d.fabricVariants.length,0)}</strong><span>Fabric variants</span></div></div><div class="stack" style="gap:10px"><label class="radio-card" style="align-items:flex-start"><input type="radio" name="import-mode" value="replace" checked><span><strong>Replace this workspace</strong><small class="muted" style="display:block;margin-top:5px">Replace all current designs, colors and preferences with this backup.</small></span></label><label class="radio-card" style="align-items:flex-start"><input type="radio" name="import-mode" value="merge"><span><strong>Merge with current designs</strong><small class="muted" style="display:block;margin-top:5px">Matching IDs keep the newer update. New IDs are added. Conflicting codes are renamed. Incoming categories are added; current defaults and preferences stay unchanged.</small></span></label></div><div class="inline-notice">Export a current backup first if you need to preserve this workspace. JSON backups are unencrypted and contain your photos and notes.</div>`,footer:'<button class="btn btn-outline" data-modal="close">Cancel</button><button class="btn btn-primary" data-modal="restore">'+icon('upload','icon-sm')+'Confirm import</button>',actions:{restore:()=>{const mode=$('input[name="import-mode"]:checked').value;let patch;if(mode==='replace')patch={designs:data.designs,colors:data.colors,settings:data.settings};else{const map=new Map(state.designs.map(d=>[d.id,clone(d)]));for(const d of data.designs){const old=map.get(d.id);if(!old||new Date(d.updatedAt)>=new Date(old.updatedAt))map.set(d.id,clone(d))}const codes=new Set();const merged=[...map.values()].map(d=>{let code=d.code,n=1;const base=code.slice(0,80);while(codes.has(code.toLowerCase()))code=`${base}-IMPORTED${n++===1?'':`-${n-1}`}`;d.code=code;codes.add(code.toLowerCase());return d});const colors=new Map(state.colors.map(c=>[colorKey(c),c]));for(const c of data.colors)if(!colors.has(colorKey(c)))colors.set(colorKey(c),c);patch={designs:merged,colors:normalizeColors([...colors.values()]),settings:{...state.settings,categories:mergeCategoryCatalogs(state.settings.categories,data.settings.categories)}}}
 if(persistPatch(patch,true)){state.editor=null;state.variants=Object.create(null);closeModal();render(true);toast(saveText(`${data.designs.length} design${data.designs.length===1?'':'s'} imported. ${mode==='merge'?'Workspace merged.':'Backup restored.'}`))}}}})
}
function clearData(){openModal({title:'Clear this workspace?',body:`<div class="modal-badge-icon danger">${icon('trash')}</div><p class="modal-description">This will remove <strong>${state.designs.length} designs, their photos, ${state.colors.length} custom colors and all settings</strong> from this browser. It does not delete downloaded backups.</p><button class="btn btn-outline" style="width:100%" data-modal="backup">${icon('download','icon-sm')}Export a backup first</button><p class="field-hint" style="margin-top:14px">Step 1 of 2 · You will be asked to type DELETE next.</p>`,footer:'<button class="btn btn-outline" data-modal="close">Keep my data</button><button class="btn btn-danger" data-modal="continue">Continue to confirmation</button>',actions:{backup:exportAll,continue:()=>{closeModal();openModal({title:'One last safety check.',body:'<p class="modal-description">This cannot be undone in the app. Type <strong>DELETE</strong> below to confirm that you want to empty this workspace.</p><label class="field-label" for="clear-confirm">Type DELETE</label><input id="clear-confirm" style="width:100%" placeholder="DELETE" autocomplete="off" autocapitalize="characters" spellcheck="false" autofocus><p class="field-hint">Step 2 of 2 · All designs, colors and settings.</p>',footer:'<button class="btn btn-outline" data-modal="close">Cancel</button><button class="btn btn-danger" data-modal="clear-final" id="clear-final" disabled>Clear all data</button>',actions:{'clear-final':()=>{if($('#clear-confirm').value!=='DELETE')return;if(persistPatch({designs:[],colors:[],settings:{...DEFAULTS}},true)){state.editor=null;state.variants=Object.create(null);state.library={query:'',category:'all',sort:'latest',favorites:false};closeModal();render(true);toast('Workspace cleared. You can start fresh.')}}}})}}})}
function updateSetting(key,value,feedback=true){const settings={...state.settings,[key]:value};if(!persistPatch({settings}))return false;render(true);if(feedback)toast(saveText('Preference updated.'));return true}
function showHelp(){openModal({title:'A little color. A clearer shift.',className:'wide',body:`<p class="modal-description">Your private, offline reference — built around colors, not fixed needle numbers.</p><ol class="instructions-list"><li><strong>Design first.</strong> Add a photo, design name, code, category and total stitch count.</li><li><strong>Just the range.</strong> Home Set needs only the X range from / to. This range appears on every library design card. Optional Y, hoop, center and notes stay inside the extra frame references.</li><li><strong>Park & Kapda stay independent.</strong> Save where the machine stands and which physical needle attaches the fabric. Neither position adds a design color.</li><li><strong>Fabric, then colors.</strong> Choose a fabric first, set the number of thread colors and type their names directly. Color codes are optional. Tap quick shades or choose saved colors to fill references.</li><li><strong>No needle selection required.</strong> White can be on Needle 1 today and Needle 3 or 4 tomorrow. Save design colors without a fixed needle. Optional run references are tucked away and can change anytime without moving the colors or fabric overrides.</li><li><strong>Your categories.</strong> Settings → My machine lets you choose a default category. The Categories section lets you add, delete and set a default. Deleting a used category asks where its designs should move; it never deletes designs.</li><li><strong>Your machine.</strong> Set physical needles per head (default 15), default heads, speed, density, underlay, trim and hoop. Defaults apply to new designs only. Changing capacity preserves saved data and shows compatibility warnings.</li><li><strong>Fabric variants.</strong> Choose a fabric on the production page to see its colors and inactive references. Blue marks a fabric-specific color change; amber marks Kapda only when an optional needle reference matches the attachment position.</li><li><strong>Run safely.</strong> Verify actual threads, stitch file, stabilizer, tension, speed limits and frame clearance at the machine.</li><li><strong>Hand over & back up.</strong> Blur-save design notes, add dated logs, share a setup, or print a clean A4 reference. Export JSON regularly; backups include your category catalog and default. Imports can restore or merge. Backups are unencrypted.</li></ol><div class="inline-notice">Long-press a card for actions. Swipe between production tabs. Press <span class="mono">/</span> to search. सुई · कपड़ा · रंग · होम सेट · स्पीड · डेंसिटी · वेरिएंट. Everything stays in this browser.</div>`,footer:'<button class="btn btn-primary" data-modal="close">Ready for the next run</button>'})}
function workerSource(){const filename=location.pathname.split('/').filter(Boolean).pop()||'EmbroideryGuide.html';const shell=/\.html?$/i.test(filename)?filename:'EmbroideryGuide.html';return `/* EmbroideryGuide ${VERSION} · optional hosted-PWA deployment helper.\n   Serve this file as embroideryguide-sw.js next to the HTML using HTTPS. */\nconst CACHE='embroideryguide-v${VERSION}';\nconst SHELL=new URL(${JSON.stringify('./'+shell)},self.registration.scope).href;\nself.addEventListener('install',event=>{event.waitUntil(caches.open(CACHE).then(cache=>cache.add(SHELL)).then(()=>self.skipWaiting()));});\nself.addEventListener('activate',event=>{event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(key=>key.startsWith('embroideryguide-v')&&key!==CACHE).map(key=>caches.delete(key)))).then(()=>self.clients.claim()));});\nself.addEventListener('fetch',event=>{if(event.request.method!=='GET'||new URL(event.request.url).origin!==self.location.origin)return;event.respondWith(caches.open(CACHE).then(async cache=>{const cached=await cache.match(event.request,{ignoreSearch:true});if(cached)return cached;try{const response=await fetch(event.request);if(response.ok&&response.type==='basic')await cache.put(event.request,response.clone());return response;}catch(error){if(event.request.mode==='navigate'){const shell=await cache.match(SHELL);if(shell)return shell;}throw error;}}));});\n`}
