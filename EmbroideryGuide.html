body,:root[data-theme=light] body{background:var(--bg)}

></div>${icon('arrow')}<div class="compare-color">${n.isActive?`${swatch(n.colorHex)}<div><strong>${e(n.colorName||'Unassigned')}</strong><small>${e(n.colorCode||'—')}</small></div>`:`${icon('minus')}<strong>${e(t('unused'))}</strong>`}</div></div>`).join(''):`<div class="inline-notice">${icon('checkCircle','icon-sm')} This fabric uses the base thread colors without changes.</div>`}`:`<div class="inline-notice">Select a fabric above to compare its thread setup with the base design. The base setup is currently active.</div>`}`}` }
function homePanel(d){return rangeOnlyPanel(d)}
function homeWarning(h){const[w,ht]=hoopDimensions(h);return num(h.xMax)-num(h.xMin)>w||num(h.yMax)-num(h.yMin)>ht?`<div class="warning-banner amber" style="margin-top:18px">${icon('warning')}The saved home range exceeds this hoop’s nominal dimensions. Confirm hoop orientation, working area and frame clearance at the machine.</div>`:''}
function machinePanel(d){const m=d.machineSettings;return `<div class="panel-heading"><div><h2>${e(t('machineSettings'))}</h2><p>Your saved reference for a consistent run.</p></div><span class="pill">${icon('machine','icon-sm')}${m.machineType==='multiHead'?`${m.headCount} heads`:'Single head'}</span></div>${m.speed>1000?`<div class="warning-banner">${icon('warning')}<div><strong>High-speed setup — over 1,000 RPM</strong><br>Confirm the machine’s rated speed, fabric stability and thread suitability. Run a sample and reduce speed if thread breaks or puckering occur.</div></div>`:''}<div class="machine-grid"><div class="speed-card" style="--speed-color:${speedColor(m.speed)}"><div class="row between"><div class="stat-label">${e(t('speed'))}</div>${icon('gauge')}</div><div class="speed-value">${m.speed}<small>RPM</small></div><div class="speed-state"><span class="dot" style="background:var(--speed-color)"></span>${speedLabel(m.speed)}</div><div class="speed-meter">${Array.from({length:16},(_,i)=>`<i class="${i<Math.round((m.speed-400)/800*15)+1?'lit':''}"></i>`).join('')}</div><div class="speed-scale"><span>400</span><span>800</span><span>1,200 RPM</span></div></div><div class="info-card"><div class="row between"><span class="stat-label">${e(t('density'))} / PULL COMP.</span><strong class="mono" style="font-size:23px;color:var(--accent-light)">${m.density.toFixed(2)}</strong></div><div class="density-track"><i style="width:${m.density*100}%"></i></div><div class="speed-scale"><span>0.10</span><span>1.00</span></div><div class="machine-detail-row"><span class="left">${icon('layers','icon-sm')}${e(t('underlay'))}</span><span class="pill">${e(UNDERLAYS[m.underlay])}</span></div><div class="machine-detail-row"><span class="left">${icon('scissors','icon-sm')}${e(t('trim'))}</span><strong class="row" style="color:${m.trimOnChange?'var(--success)':'var(--secondary)'}">${icon(m.trimOnChange?'checkCircle':'minus','icon-sm')}${m.trimOnChange?'On':'Off'}</strong></div><div class="machine-detail-row"><span class="left">${icon('machine','icon-sm')}Machine type</span><strong>${e(t(m.machineType))}${m.machineType==='multiHead'?` · ${m.headCount} heads`:''}</strong></div></div></div><div class="setup-footnote">${icon('shield')}These values are operator reference notes, not commands sent to your machine. Confirm the stitch file, tension, speed limits and machine manual before production. Density / pull compensation values follow your own digitizing workflow.</div>`}
function notesPanel(d){return `<div class="panel-heading"><div><h2>${e(t('designNotes'))}</h2><p>Tap to edit. Changes save when you leave the note field.</p></div><span class="pill">${icon('lock','icon-sm')}Local only</span></div><label class="sr-only" for="inline-notes">Edit design notes</label><textarea class="inline-notes" id="inline-notes" data-id="${e(d.id)}" maxlength="40000" placeholder="Fabric handling, tension checks, finishing details…">${e(d.notes)}</textarea><div class="notes-status" id="notes-save-status">${icon('check','icon-sm')}${state.storageAvailable?'Saved on this device':'Session-only · export a backup'}</div><div class="divider" style="margin:30px 0"></div><div class="panel-heading"><div><h2>${e(t('productionLog'))}</h2><p>Dated handovers and observations for the next operator.</p></div><button class="btn btn-sm btn-outline" data-action="add-note" data-id="${e(d.id)}">${icon('plus','icon-sm')}${e(t('addNote'))}</button></div>${d.noteLog.length?`<div class="note-log">${[...d.noteLog].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(n=>`<article class="note-entry"><div class="note-date">${e(date(n.date,true))}</div><p class="note-text">${e(n.text)}</p></article>`).join('')}</div>`:`<div class="inline-notice" style="padding:20px">No production notes yet. Add the first handover, quality check or setup observation.</div>`}`}
function renderColors(){const count=allColors().length;return `<section class="page" aria-labelledby="colors-title"><div class="page-heading"><div><h1 id="colors-title">${e(t('colorLibrary'))}<span style="color:var(--accent)">.</span></h1></div><div class="heading-actions"><button class="btn btn-primary" data-action="add-color">${icon('plus')}<span class="add-design-label">${e(t('addColor'))}</span></button></div></div><div class="row wrap" style="margin:24px 0 27px;gap:9px"><span class="pill sky">${icon('spool','icon-sm')}${count} unique thread colors</span><span class="pill">${state.designs.length} designs</span><span class="pill">${state.colors.length} custom references</span></div><div class="search-sort-row colors-tools"><div class="searchbox">${icon('search')}<label class="sr-only" for="color-search">Search thread colors</label><input type="search" id="color-search" placeholder="${e(t('searchColors'))}" value="${e(state.colorSearch)}" autocomplete="off"></div><label class="sort-control"><span class="sr-only">Sort colors</span><select id="color-sort" aria-label="Sort colors"><option value="name" ${state.colorSort==='name'?'selected':''}>${e(t('name'))}</option><option value="code" ${state.colorSort==='code'?'selected':''}>${e(t('code'))}</option><option value="used" ${state.colorSort==='used'?'selected':''}>${e(t('mostUsed'))}</option></select></label></div><div class="result-heading"><span id="color-result-count"></span><span class="view-icon">Tap a color to find its designs ${icon('arrow','icon-sm')}</span></div><div class="color-grid" id="color-grid" aria-live="polite"></div><div class="library-bottom-note">${icon('info')}Screen colors are a reference. Verify against your physical thread chart.</div></section>`}
function renderColorResults(){const grid=$('#color-grid');if(!grid)return;const q=state.colorSearch.trim().toLowerCase(),list=allColors().filter(c=>`${c.name} ${c.code} ${c.hex}`.toLowerCase().includes(q)).sort((a,b)=>state.colorSort==='used'?b.designs.size-a.designs.size||a.name.localeCompare(b.name):state.colorSort==='code'?a.code.localeCompare(b.code,undefined,{numeric:true}):a.name.localeCompare(b.name,undefined,{sensitivity:'base'}));$('#color-result-count').textContent=`THREAD REFERENCES / ${String(list.length).padStart(2,'0')}`;grid.innerHTML=list.length?list.map(c=>`<button class="color-card" data-action="color-details" data-color-key="${e(c.key)}" aria-label="${e(c.name)}, ${e(c.code)}, used in ${c.designs.size} designs"><div class="color-card-swatch" style="background-color:${c.hex};color:${foreground(c.hex)}">${icon('spool')}<span class="color-hex">${e(c.hex.toUpperCase())}</span>${c.customIds.length?'<span class="color-custom-marker">CUSTOM</span>':''}</div><div class="color-card-body"><h2 class="color-card-name">${e(c.name)}</h2><div class="color-card-code">${e(c.code||'No code')}</div><div class="color-used">${icon('grid')}Used in ${c.designs.size} design${c.designs.size===1?'':'s'}</div></div></button>`).join(''):`<div class="empty-state"><div class="empty-icon">${icon('palette')}</div><h2>${q?'No matching threads.':'Build your thread reference.'}</h2><p>${q?'Try a different name or color code.':'Colors from saved designs appear here automatically. You can also add custom thread colors.'}</p><button class="btn btn-primary" data-action="${q?'clear-color-search':'add-color'}">${icon(q?'redo':'plus')}${q?'Reset search':e(t('addColor'))}</button></div>`}
function storageInfo(){let bytes=0;try{for(const key of Object.values(KEYS))bytes+=(localStorage.getItem(key)||'').length*2}catch{bytes=JSON.stringify([state.designs,state.colors,state.settings]).length*2}return{bytes,mb:(bytes/1048576).toFixed(2),percent:Math.min(100,bytes/(5*1048576)*100)}}
function renderSettings(){const storage=storageInfo(),s=state.settings;return `<section class="page" aria-labelledby="settings-title"><div class="page-heading"><div><h1 id="settings-title">${e(t('settings'))}<span style="color:var(--accent)">.</span></h1></div><button class="btn btn-outline btn-sm" data-action="help">${icon('info','icon-sm')}Quick guide</button></div><div class="settings-layout"><div class="settings-stack">${machineSettingsCard()}${categoryManagerCard()}<section class="settings-card"><h2 class="settings-card-title">${icon('folder')}Your data</h2><button class="data-action" data-action="export-all"><span class="data-action-icon">${icon('download')}</span><span><strong>${e(t('export'))}</strong><small>Download all designs, photos, colors and settings as JSON.</small></span>${icon('chevron')}</button><button class="data-action" data-action="import"><span class="data-action-icon">${icon('upload')}</span><span><strong>${e(t('import'))}</strong><small>Restore a backup, or merge designs into this workspace.</small></span>${icon('chevron')}</button><button class="data-action danger" data-action="clear-data"><span class="data-action-icon">${icon('trash')}</span><span><strong>${e(t('clear'))}</strong><small>Remove this workspace. Two confirmations are required.</small></span>${icon('chevron')}</button></section></div><aside class="settings-stack settings-aside"><section class="settings-card"><h2 class="settings-card-title">${icon('sun')}Workspace preferences</h2><div><span class="settings-label">${e(t('theme'))}</span><div class="segmented" aria-label="Color theme">${[['dark','moon'],['light','sun'],['system','monitor']].map(([v,ic])=>`<button class="segment ${s.theme===v?'active':''}" data-action="set-theme" data-value="${v}" aria-pressed="${s.theme===v}">${icon(ic)}${e(t(v))}</button>`).join('')}</div></div><div style="margin-top:23px"><span class="settings-label">${e(t('language'))}</span><div class="segmented" aria-label="Language labels">${[['hindi','हिंदी'],['english','English'],['hinglish','Hinglish']].map(([v,label])=>`<button class="segment ${s.language===v?'active':''}" data-action="set-language" data-value="${v}" aria-pressed="${s.language===v}" lang="${v==='hindi'?'hi':'en'}">${label}</button>`).join('')}</div><p class="field-hint">Hinglish pairs key production terms: सुई · कपड़ा · रंग · होम सेट · स्पीड · डेंसिटी.</p></div></section><section class="settings-card"><h2 class="settings-card-title">${icon('shield')}On this device</h2><div class="storage-visual"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="53" fill="none" stroke="var(--surface)" stroke-width="6"/><circle cx="60" cy="60" r="53" fill="none" stroke="${storage.percent>85?'var(--amber)':'var(--accent)'}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${Math.max(3,storage.percent/100*333)} 333"/></svg><div><strong>${storage.mb}</strong><span>MB estimated</span></div></div><div class="storage-kv"><span>Saved designs</span><strong>${state.designs.length}</strong></div><div class="storage-kv"><span>Custom colors</span><strong>${state.colors.length}</strong></div><div class="storage-kv"><span>Last backup download</span><strong>${s.lastBackupAt?e(date(s.lastBackupAt)):'Not yet'}</strong></div><p class="field-hint" style="margin-top:14px">Estimated UTF-16 usage against a typical 5 MB localStorage limit. Browser limits vary.</p><div class="privacy-note">${icon('lock')}<span>No account. No cloud. No tracking. Data is stored in this browser only. Export regularly — browser cleanup, private mode or moving the HTML file can make saved data unavailable.</span></div><button class="btn btn-outline btn-sm" style="width:100%;margin-top:18px" data-action="protect-storage">${icon('shield','icon-sm')}Request persistent storage</button></section>${platformOfflineCard()}<section class="settings-card"><div class="about-brand"><span class="brand-mark">${icon('spool')}</span><div><strong>EmbroideryGuide</strong><small>Version ${VERSION} · Offline edition</small></div></div><p class="about-text">Clarity at every needle.<br>Made for operators who turn great designs into great production.</p><p class="about-text" style="margin-top:12px">Demo photography is AI-generated and illustrates sample designs. Thread colors and machine values are references, not machine instructions.</p><div class="row wrap" style="gap:7px;margin-top:17px"><span class="pill">100% on-device</span><span class="pill">No subscription</span></div></section></aside></div></section>`}

const STEP_TITLES=['designSetup','homeSet','positionSetup','fabricThreads','machineSettings'];
const STEP_ICONS=['image','frame','needle','fabric','gauge'];
const STEP_DESCRIPTIONS=['Design name, code & stitches','Only the range you need','Park position & fabric needle','Fabric first, then thread colors','Speed & final production check'];
function ensureEditor(){const key=state.route.id||'new';if(state.editor?.key===key)return state.editor;const source=state.route.id?getDesign(state.route.id):null;if(state.route.id&&!source)return null;state.editor={key,isNew:!source,design:prepareFlowDraft(source?clone(source):blankDesign()),originalUpdatedAt:source?.updatedAt||null,step:state.nextEditorStep??0,dirty:false,expanded:new Set(),overrideEditing:new Set(),colorEntryOrder:new Map(),homeAdvanced:false,photoPending:false};state.nextEditorStep=null;return state.editor}
function renderEditor(){const ed=ensureEditor();if(!ed)return missingDesign();const d=ed.design;return `<section class="page" aria-labelledby="editor-title"><div class="back-row"><button class="back-btn" data-action="editor-cancel">${icon('back','icon-sm')}${e(ed.isNew?t('backLibrary'):'Back to design')}</button><span class="breadcrumb">${ed.dirty?'Unsaved changes':'Changes save at the final step'}</span></div><div class="page-heading editor-heading"><div><h1 id="editor-title">${e(t(ed.isNew?'addDesign':'editDesign'))}<span style="color:var(--accent)">.</span></h1>${!ed.isNew?`<p class="subtitle">${e(d.name)} · ${e(d.code)}</p>`:''}</div><button class="btn btn-ghost btn-sm" data-action="editor-cancel">${e(t('cancel'))}</button></div><div class="editor-layout"><aside><div class="editor-steps" aria-label="Design setup progress">${STEP_TITLES.map((s,i)=>`<button class="editor-step ${ed.step===i?'active':ed.step>i?'complete':''}" data-action="editor-step" data-step="${i}" ${ed.step===i?'aria-current="step"':''}><span class="step-number">${ed.step>i?icon('check','icon-sm'):String(i+1).padStart(2,'0')}</span><span><strong>${e(t(s))}</strong><small>${STEP_DESCRIPTIONS[i]}</small></span></button>`).join('')}</div><div class="editor-sidebar-note">${icon('shield')}<span>Everything stays on this device.<br>Save at step 5, then export regular backups to protect your work.</span></div></aside><div class="editor-form"><div id="editor-errors" role="alert"></div><div id="editor-content">${editorStepContent(ed)}</div><div class="editor-footer"><span class="step-count">STEP ${String(ed.step+1).padStart(2,'0')} / 05</span><div class="editor-footer-actions">${ed.step>0?`<button class="btn btn-outline" data-action="editor-prev">${icon('back','icon-sm')}${e(t('back'))}</button>`:''}<button class="btn btn-primary" data-action="${ed.step===4?'editor-save':'editor-next'}">${e(t(ed.step===4?(ed.isNew?'save':'update'):'next'))}${icon(ed.step===4?'check':'arrow','icon-sm')}</button></div></div><div class="editor-progress" aria-hidden="true"><i style="width:${(ed.step+1)*20}%"></i></div></div></div><datalist id="thread-color-names">${allColors().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${e(c.name)}">${e(c.code)}</option>`).join('')}</datalist></section>`}
function stepHeading(ed,subtitle){return `<div class="step-heading">${icon(STEP_ICONS[ed.step])}<div><h2>${e(t(STEP_TITLES[ed.step]))}</h2><p>${subtitle}</p></div></div>`}
function editorStepContent(ed){if(ed.step===0)return basicEditor(ed);if(ed.step===1)return homeEditor(ed);if(ed.step===2)return positionEditor(ed);if(ed.step===3)return fabricThreadsEditor(ed);return machineEditor(ed)}
function basicEditor(ed){const d=ed.design;return `${stepHeading(ed,ft('First set which design will run: photo, name, code and total stitch count.','पहले चलने वाला डिज़ाइन सेट करें: फ़ोटो, नाम, कोड और कुल टाँके।','Sabse pehle kaunsa design chalega: photo, naam, code aur kitne stitches hain.'))}<div class="form-grid"><div class="form-field full"><span class="field-label">Design photo <span class="muted tiny">· optional</span></span><div id="photo-drop" class="photo-drop ${d.photoBase64?'has-photo':''}">${photoDropContent(ed)}</div><input type="file" accept="image/*" id="photo-upload" hidden aria-label="Upload design photograph"><input type="file" accept="image/*" capture="environment" id="photo-camera" hidden aria-label="Take design photograph"><p class="field-hint">JPG, PNG, WebP or a camera photo · automatically compressed for offline storage.</p></div><div class="form-field"><label class="field-label" for="design-name">${e(t('designName'))}<span class="required">*</span></label><input id="design-name" data-field="name" value="${e(d.name)}" maxlength="200" placeholder="e.g. Floral Border" required autocomplete="off"></div><div class="form-field"><label class="field-label" for="design-code">${e(t('designCode'))}<span class="required">*</span></label><input id="design-code" data-field="code" value="${e(d.code)}" maxlength="100" placeholder="e.g. D004" required autocomplete="off" spellcheck="false"><p class="field-hint">A unique code makes every setup easy to find.</p></div><div class="form-field"><label class="field-label" for="design-stitches">${e(t('stitchCount'))}<span class="required">*</span></label><input id="design-stitches" type="number" data-field="stitchCount" value="${e(d.stitchCount??'')}" min="1" max="100000000" step="1" inputmode="numeric" placeholder="e.g. 21480" required><p class="field-hint">${e(ft('Total stitches shown in the design / machine file.','डिज़ाइन या मशीन फ़ाइल में दिख रहे कुल टाँके।','Design / machine file mein dikhne wale total stitches.'))}</p></div><div class="form-field"><label class="field-label" for="design-category">${e(t('category'))}</label><select id="design-category" data-field="category">${categoryOptions(d.category,true)}</select></div><div class="form-field full"><label class="field-label" for="design-notes">${e(t('notes'))} <span class="muted tiny">· optional</span></label><textarea id="design-notes" data-field="notes" maxlength="40000" placeholder="Fabric handling, stabilizer, tension or finishing details…">${e(d.notes)}</textarea></div></div>`}
function photoDropContent(ed){const d=ed.design;return `${d.photoBase64?`<img src="${d.photoBase64}" alt="${e(d.name||'Uploaded design')} reference"><div class="photo-drop-actions"><button class="btn btn-sm" data-action="upload-photo">${icon('image','icon-sm')}Change photo</button><button class="btn btn-sm" data-action="camera-photo">${icon('camera','icon-sm')}Camera</button><button class="btn btn-sm" data-action="remove-photo" aria-label="Remove photograph">${icon('trash','icon-sm')}</button></div>`:`<div class="photo-icon">${icon('image')}</div><div><h3>A photo makes the right design unmistakable.</h3><p>Tap to upload, or drop a photo here.</p><div class="row wrap" style="justify-content:center;gap:7px"><button class="btn btn-outline" data-action="upload-photo">${icon('upload','icon-sm')}Upload photo</button><button class="btn btn-outline" data-action="camera-photo">${icon('camera','icon-sm')}Camera</button></div></div>`}${ed.photoPending?'<div class="pending-photo"><div class="spinner"></div><span>Optimizing photo…</span></div>':''}`}

function overrideIsChanged(o,n){return o&&(o.colorName!==n.colorName||o.colorCode!==n.colorCode||o.colorHex.toLowerCase()!==n.colorHex.toLowerCase())}

 else if(el.dataset.vcontrol){const v=d.fabricVariants[Number(el.dataset.vindex)],n=d.needles.find(n=>n.no===Number(el.dataset.overrideNo));if(!v||!n)return true;let o=ensureOverride(v,n);if(el.dataset.vcontrol==='active'){o.isActive=el.checked}else{const key=`${v.id}:${n.no}`;if(el.checked)ed.overrideEditing.add(key);else{ed.overrideEditing.delete(key);o.colorName=n.colorName;o.colorCode=n.colorCode;o.colorHex=n.colorHex;if(o.isActive)v.needleOverrides=v.needleOverrides.filter(x=>x.needleNo!==n.no)}}refreshEditorContent()}

function stepErrors(ed,step){const d=ed.design,errors=[];if(ed.photoPending)errors.push('Wait for the photo to finish optimizing.');if(step===0){if(!d.name.trim())errors.push('Enter a design name.');if(!d.code.trim())errors.push('Enter a design code / ID.');else if(state.designs.some(x=>x.id!==d.id&&x.code.trim().toLowerCase()===d.code.trim().toLowerCase()))errors.push('That design code already exists. Choose a unique code.')}
 if(step===1){const h=d.homeSet;for(const f of ['xMin','xMax','yMin','yMax','centerX','centerY'])if(typeof h[f]!=='number'||!Number.isFinite(h[f])||Math.abs(h[f])>100000)errors.push(`${f.replace(/([A-Z])/g,' $1')} needs a valid number between −100,000 and 100,000.`);if(num(h.xMin)>=num(h.xMax))errors.push('X Max must be greater than X Min.');if(num(h.yMin)>=num(h.yMax))errors.push('Y Max must be greater than Y Min.');if(num(h.centerX)<num(h.xMin)||num(h.centerX)>num(h.xMax)||num(h.centerY)<num(h.yMin)||num(h.centerY)>num(h.yMax))errors.push('Center X and Y must lie inside the saved range.');if(h.hoopSize==='custom')for(const f of ['customHoopWidth','customHoopHeight'])if(typeof h[f]!=='number'||h[f]<1||h[f]>5000)errors.push('Custom hoop dimensions must be between 1 and 5,000 mm.')}
 if(step===4){const m=d.machineSettings;if(!Number.isInteger(m.speed)||m.speed<400||m.speed>1200||m.speed%10!==0)errors.push('Speed must be 400–1,200 RPM in steps of 10.');if(typeof m.density!=='number'||m.density<.1||m.density>1||Math.abs((m.density-.1)/.05-Math.round((m.density-.1)/.05))>.00001)errors.push('Density must be 0.10–1.00 in steps of 0.05.');if(m.machineType==='multiHead'&&(!Number.isInteger(m.headCount)||m.headCount<1||m.headCount>64))errors.push('Enter a head count from 1 to 64.')}
 errors.push(...flowStepErrors(ed,step));
 return [...new Set(errors)];
}
function showEditorErrors(errors){if(state.editor?.step===1&&errors.some(x=>/Center|center|Y |y |Custom|custom/i.test(x))){state.editor.homeAdvanced=true;const more=$('#range-advanced');if(more)more.open=true}const box=$('#editor-errors');if(box){box.innerHTML=`<div class="form-error"><strong>Please check this step.</strong><ul style="margin:6px 0 0;padding-left:17px">${errors.map(err=>`<li>${e(err)}</li>`).join('')}</ul></div>`;box.scrollIntoView({behavior:'smooth',block:'center'})}if(state.editor?.step===0){const d=state.editor.design;if(!d.name.trim())$('#design-name')?.focus({preventScroll:true});else if(!d.code.trim()||errors.some(x=>x.includes('design code')))$('#design-code')?.focus({preventScroll:true});else if(!d.stitchCount)$('#design-stitches')?.focus({preventScroll:true})}}
function changeEditorStep(target){const ed=state.editor;if(!ed)return;if(target>ed.step){for(let i=0;i<target;i++){const errors=stepErrors(ed,i);if(errors.length){if(ed.step!==i){ed.step=i;render(true)}showEditorErrors(errors);return}}}ed.step=Math.max(0,Math.min(4,target));render(true);$('.editor-form')?.scrollIntoView({behavior:'smooth',block:'start'})}


async function handlePhoto(file){const ed=state.editor;if(!ed||!file)return;if(file.size>20*1024*1024){toast('Choose a photo under 20 MB.','error');return}if(!file.type.startsWith('image/')||file.type.includes('svg')){toast('Choose a standard image or camera photo, not an SVG or document.','error');return}ed.photoPending=true;markDirty();if($('#photo-drop'))$('#photo-drop').innerHTML=photoDropContent(ed);let url;
 try{url=URL.createObjectURL(file);const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(Error('This image format cannot be read. Try a JPG, PNG or WebP photo.'));image.src=url});if(!image.naturalWidth||!image.naturalHeight)throw Error('The photo has no readable dimensions.');const scale=Math.min(1,1200/Math.max(image.naturalWidth,image.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.round(image.naturalWidth*scale);canvas.height=Math.round(image.naturalHeight*scale);const ctx=canvas.getContext('2d');if(!ctx)throw Error('Photo processing is unavailable in this browser.');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);let quality=.80,result=canvas.toDataURL('image/jpeg',quality);while(result.length>380000&&quality>.4){quality-=.1;result=canvas.toDataURL('image/jpeg',quality)}if(result.length>500000){const smaller=document.createElement('canvas');smaller.width=Math.round(canvas.width*.7);smaller.height=Math.round(canvas.height*.7);smaller.getContext('2d').drawImage(canvas,0,0,smaller.width,smaller.height);result=smaller.toDataURL('image/jpeg',.65)}if(state.editor!==ed)return;ed.design.photoBase64=result;toast('Photo added · optimized for offline storage.')}
 catch(err){toast(err.message||'Photo could not be processed. Try a smaller JPG.','error')}
 finally{if(url)URL.revokeObjectURL(url);ed.photoPending=false;if(state.editor===ed&&$('#photo-drop')){$('#photo-drop').classList.toggle('has-photo',!!ed.design.photoBase64);$('#photo-drop').innerHTML=photoDropContent(ed)}if($('#photo-upload'))$('#photo-upload').value='';if($('#photo-camera'))$('#photo-camera').value=''}
}

 if(state.storageAvailable&&!state.problem){try{const raw=localStorage.getItem(KEYS.designs);if(raw!==null)state.designs=normalizeDesignList(JSON.parse(raw))}catch{toast('Saved data changed or became unreadable. Export recovery data before trying again.','error');return}}

function selectedFabricId(d){return state.variants[d.id]!==undefined?state.variants[d.id]:(d.activeFabricId??null)}
function baseFabric(d){return d.fabricVariants.find(v=>v.id===d.baseFabricId)||d.fabricVariants[0]||null}
function draftFabric(ed){return ed.design.fabricVariants.find(v=>v.id===ed.design.activeFabricId)||baseFabric(ed.design)}
function runningNeedles(d, variantID=selectedFabricId(d)){return effectiveNeedles(d,variantID).filter(n=>n.isActive)}

function setKapdaRole(d,no){d.setupNeedles.kapdaNeedleNo=no;for(const n of d.needles)n.isKapdaNeedle=Number.isInteger(no)&&n.assignedNeedleNo===no}
function makeOverride(no,n){return{needleNo:no,colorName:n.colorName,colorCode:n.colorCode,colorHex:n.colorHex,isActive:n.isActive!==false,assignedNeedleNo:n.assignedNeedleNo??null}}
function rebaseFabric(d,newBaseId){
 const v=d.fabricVariants.find(v=>v.id===newBaseId);if(!v)return;
 const snapshots=new Map(d.fabricVariants.map(v=>[v.id,effectiveNeedles(d,v.id)]));
 d.needles=snapshots.get(newBaseId).map(n=>({no:n.no,colorName:n.colorName,colorCode:n.colorCode,colorHex:n.colorHex,isActive:n.isActive,isKapdaNeedle:n.isKapdaNeedle,assignedNeedleNo:n.assignedNeedleNo??null}));

(ft('Fabric variant','कपड़ा वेरिएंट','Fabric variant'))}</span>`:''}${n.assignedNeedleNo?`<small>${icon('needle','icon-sm')}${setupNo(n.assignedNeedleNo)} · ${e(ft('optional run reference','वैकल्पिक रन संदर्भ','optional run reference'))}</small>`:''}</div>`:''}</div>`).join('')}</div>

function refreshFlowThreadArea(){const ed=state.editor;if(!ed||!$('#flow-thread-area'))return;$('#flow-thread-area').innerHTML=flowThreadArea(ed);for(const v of ed.design.fabricVariants){const card=$(`[data-action="flow-select-fabric"][data-id="${v.id}"]`);if(card)card.querySelector('.flow-fabric-active-count').textContent=`${runningNeedles(ed.design,v.id).length} ${ft('running','रंग','colors')}`}}
function writeFabricNeedle(d,fid,no,values){const n=d.needles.find(n=>n.no===no);if(!n)return;const f=d.fabricVariants.find(v=>v.id===fid);if(!f||fid===baseFabric(d)?.id){Object.assign(n,values);const o=f?.needleOverrides.find(o=>o.needleNo===no);if(o&&Object.hasOwn(values,'assignedNeedleNo')&&Object.hasOwn(o,'assignedNeedleNo'))o.assignedNeedleNo=values.assignedNeedleNo;return}const o=ensureOverride(f,n);Object.assign(o,values);if(!overrideDiffers(o,n))f.needleOverrides=f.needleOverrides.filter(x=>x!==o)}
function syncFlowInput(el,isChange=false){const ed=state.editor;if(!ed)return false;const d=ed.design;
 if(el.dataset.field==='stitchCount'){d.stitchCount=el.value===''?null:Number(el.value);markDirty();return true}
 if(el.dataset.flowRole){const no=el.value===''?null:Number(el.value);d.setupNeedles[el.dataset.flowRole]=no;if(el.dataset.flowRole==='kapdaNeedleNo')setKapdaRole(d,no);markDirty();if($('#flow-position-preview'))$('#flow-position-preview').innerHTML=positionPreview(d);return true}
 if(el.dataset.flowFabric!==undefined){const f=d.fabricVariants[Number(el.dataset.flowFabric)];if(!f)return true;f[el.dataset.flowFabricField]=el.value;markDirty();refreshFlowThreadArea();return true}
 if(el.dataset.flowThread){const f=draftFabric(ed);if(!f)return true;const no=Number(el.dataset.flowThread),field=el.dataset.flowThreadField;writeFabricNeedle(d,f.id,no,{[field]:el.value});if(field==='colorName'&&isChange){const match=threadColorChoices().find(c=>c.name.toLowerCase()===el.value.trim().toLowerCase());if(match){const n=effectiveNeedles(d,f.id).find(n=>n.no===no),values={colorHex:match.hex};if(!n.colorCode.trim()||match.code)values.colorCode=match.code;writeFabricNeedle(d,f.id,no,values);const code=$(`#thread-code-${no}`);if(code)code.value=values.colorCode??n.colorCode}}updateThreadPreview(ed,no);markDirty();return true}
 if(el.dataset.threadAssignment){const f=draftFabric(ed),value=el.value===''?null:Number(el.value);if(f&&(value===null||Number.isInteger(value)&&value>=1&&value<=machineCapacity())){writeFabricNeedle(d,f.id,Number(el.dataset.threadAssignment),{assignedNeedleNo:value});markDirty();refreshFlowThreadArea()}return true}return false}
async function applyRunningColors(count){const ed=state.editor;if(!ed)return;const d=syncThreadSlots(ed.design),f=draftFabric(ed);if(!f)return;if(!Number.isInteger(count)||count<1||count>60){toast(ft('Use 1–60 thread colors. This is independent of physical needle capacity.','1–60 धागे के रंग चुनें। यह मशीन की सुइयों की संख्या से अलग है।','1–60 thread colors daalein. Yeh physical needle capacity se alag hai.'),'error');return}
 const current=draftRunningNeedles(ed,f.id);if(count<current.length&&!await confirmDialog(ft('Reduce running colors?','चलने वाले रंग कम करें?','Chalne wale colors kam karein?'),ft('Extra entries become inactive for this fabric. Their thread names, codes and saved references are kept.','अतिरिक्त रंग इस कपड़े पर नहीं चलेंगे। उनके नाम, कोड व पुराने संदर्भ सुरक्षित रहेंगे।','Extra colors is fabric par inactive honge. Naam, codes aur saved references delete nahi honge.'),'Apply count'))return;
 const kept=current.slice(0,count).map(n=>n.no),candidates=effectiveNeedles(d,f.id).filter(n=>!kept.includes(n.no)).sort((a,b)=>Number(!!(b.colorName.trim()||b.colorCode.trim()))-Number(!!(a.colorName.trim()||a.colorCode.trim()))||a.no-b.no);
 for(const n of candidates)if(kept.length<count)kept.push(n.no);for(let no=1;kept.length<count&&no<=60;no++)if(!d.needles.some(n=>n.no===no)){d.needles.push(blankNeedle(no));kept.push(no)}d.needles.sort((a,b)=>a.no-b.no);
 for(const n of d.needles)writeFabricNeedle(d,f.id,n.no,{isActive:kept.includes(n.no)});ed.colorEntryOrder.set(f.id,kept);markDirty();refreshFlowThreadArea();const first=draftRunningNeedles(ed,f.id).find(n=>!n.colorName.trim());if(first)$(`#thread-name-${first.no}`)?.focus({preventScroll:true})}

async function runFlowAction(action,button){const ed=state.editor;if(!action.startsWith('flow-'))return false;if(!ed)return true;const d=ed.design;
 if(action==='flow-select-fabric'){d.activeFabricId=button.dataset.id;markDirty();refreshEditorContent();return true}
 if(action==='flow-add-fabric'){if(d.fabricVariants.length>=50)return true;const v={id:uuid(),fabricName:'',fabricHex:'#BD8BEA',needleOverrides:[]};d.fabricVariants.push(v);if(!d.baseFabricId)d.baseFabricId=v.id;d.activeFabricId=v.id;markDirty();refreshEditorContent();$(`#flow-fabric-name-${d.fabricVariants.length-1}`)?.focus();return true}
 if(action==='flow-remove-fabric'){const f=d.fabricVariants.find(v=>v.id===button.dataset.id);if(!f||d.fabricVariants.length<=1)return true;if(!await confirmDialog('Remove this fabric?',`${f.fabricName||'This fabric'} and its overrides will be removed from this draft.`,'Remove fabric',true))return true;const remaining=d.fabricVariants.filter(v=>v.id!==f.id);if(f.id===baseFabric(d)?.id)rebaseFabric(d,remaining[0].id);d.fabricVariants=remaining;ed.colorEntryOrder.delete(f.id);if(d.activeFabricId===f.id)d.activeFabricId=remaining[0].id;markDirty();refreshEditorContent();return true}
 if(action==='flow-apply-colors'){await applyRunningColors(Number($('#running-needle-count')?.value));return true}
 if(action==='flow-add-thread'){const f=draftFabric(ed);if(f)await applyRunningColors(runningNeedles(d,f.id).length+1);return true}
 if(action==='flow-remove-thread'){const f=draftFabric(ed),no=Number(button.dataset.no);if(f&&runningNeedles(d,f.id).length>1){writeFabricNeedle(d,f.id,no,{isActive:false});markDirty();refreshFlowThreadArea()}return true}
 if(action==='flow-quick-color'){await useQuickThreadColor(Number(button.dataset.index));return true}
 if(action==='flow-pick-color'){openThreadPicker(Number(button.dataset.no));return true}return true}
function flowStepErrors(ed,step){const d=ed.design,errors=[];if(step===0&&(!Number.isInteger(d.stitchCount)||d.stitchCount<1||d.stitchCount>100000000))errors.push(ft('Enter the design stitch count (a whole number greater than 0).','डिज़ाइन के कुल टाँके भरें (0 से बड़ी पूर्ण संख्या)।','Design mein kitne stitches hain? 0 se bada poora number daalein.'));
 if(step===2)for(const [key,label]of [['parkedNeedleNo','Parked needle'],['kapdaNeedleNo','Kapda attachment needle']])if(!Number.isInteger(d.setupNeedles?.[key])||d.setupNeedles[key]<1||d.setupNeedles[key]>machineCapacity())errors.push(`${label}: choose any physical machine needle from 1 to ${machineCapacity()} (Settings → My machine).`);
 if(step===3){if(!d.fabricVariants.length)errors.push(ft('Add and select the fabric color first.','पहले कपड़े का रंग जोड़ें और चुनें।','Pehle kapde ka rang add aur select karein.'));const names=new Set();for(const v of d.fabricVariants){if(!v.fabricName.trim())errors.push('Every fabric needs a color name.');const key=v.fabricName.trim().toLowerCase();if(names.has(key))errors.push('Give each fabric a unique color name.');names.add(key);const rows=draftRunningNeedles(ed,v.id);if(!rows.length)errors.push(`${v.fabricName||'This fabric'} needs at least one thread color.`);for(const [i,n]of rows.entries())if(!n.colorName.trim())errors.push(`${v.fabricName||'Fabric'} · Color ${i+1}: enter the thread color name. No needle selection is required.`)}
 const input=$('#running-needle-count'),f=draftFabric(ed);if(ed.step===3&&input&&f&&Number(input.value)!==runningNeedles(d,f.id).length)errors.push('Tap Apply colors to use the color count you entered.')}return [...new Set(errors)]}

function normalizeCategoryList(value){if(value===undefined)return DEFAULT_CATEGORY_ITEMS.map(c=>({...c}));if(!Array.isArray(value)||value.length>80)throw Error('Categories must be an array of up to 80 entries.');const ids=new Set(),names=new Set();return value.map(c=>{if(!c||typeof c!=='object'||typeof c.id!=='string'||!/^[a-z\d_-]{1,100}$/i.test(c.id)||['all','uncategorized'].includes(c.id)||ids.has(c.id))throw Error('Invalid or duplicate category ID.');const name=checkedText(c.name,'Category name',40,true).trim(),key=name.toLocaleLowerCase();if(names.has(key))throw Error('Category names must be unique.');ids.add(c.id);names.add(key);return{id:c.id,name,hex:checkedHex(c.hex,'Category color')}})}

function categoryStyle(id){const hex=categoryItem(id)?.hex||DEFAULT_CATEGORY_ITEMS.find(c=>c.id===id)?.hex||'#A78BFA',rgb=[1,3,5].map(n=>parseInt(hex.slice(n,n+2),16)),luma=values=>values.map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4}).reduce((sum,v,i)=>sum+v*[.2126,.7152,.0722][i],0),hexOf=values=>'#'+values.map(v=>v.toString(16).padStart(2,'0')).join('');let strong=rgb.map(v=>Math.round(v*.53)),light=[...rgb];while(luma(strong)>.15)strong=strong.map(v=>Math.round(v*.94));while(luma(light)<.34)light=light.map(v=>Math.round(v+(255-v)*.12));return `--cat-rgb:${rgb.join(',')};--cat-light:${hexOf(light)};--cat-strong:${hexOf(strong)}`}

function deleteCategory(id){const c=categoryItem(id);if(!c)return;const used=state.designs.filter(d=>d.category===id).length,remaining=state.settings.categories.filter(c=>c.id!==id),replacement=state.settings.defaultCategory!==id?state.settings.defaultCategory:remaining[0]?.id||'uncategorized';openModal({title:ft('Delete category?','श्रेणी हटाएँ?','Category delete karein?'),body:`<div class="category-delete-preview" style="${categoryStyle(id)}">${icon('folder')}<strong>${e(categoryName(id))}</strong></div><p class="modal-description">${e(used?ft(`${used} saved designs use this category. The designs will not be deleted; choose their replacement category below.`,`${used} डिज़ाइन इस श्रेणी में हैं। डिज़ाइन नहीं हटेंगे; नीचे उनकी नई श्रेणी चुनें।`,`${used} saved designs is category mein hain. Designs delete nahi honge; neeche replacement category choose karein.`):ft('This removes the category from your choices. No design is deleted.','यह श्रेणी विकल्पों से हटेगी। कोई डिज़ाइन नहीं हटेगा।','Category choices se hat jayegi. Koi design delete nahi hoga.'))}</p><label class="field-label" for="category-replacement">${e(ft('Move designs / default to','डिज़ाइन / डिफ़ॉल्ट यहाँ भेजें','Designs / default ko yahan move karein'))}</label><select id="category-replacement" style="width:100%">${[...remaining,{id:'uncategorized',name:t('uncategorized')}].map(c=>`<option value="${e(c.id)}" ${c.id===replacement?'selected':''}>${e(categoryName(c.id))}</option>`).join('')}</select>`,footer:`<button class="btn btn-outline" data-modal="close">${e(t('cancel'))}</button><button class="btn btn-danger" data-modal="delete-category">${icon('trash','icon-sm')}${e(ft('Delete category','श्रेणी हटाएँ','Delete category'))}</button>`,actions:{'delete-category':()=>{const target=$('#category-replacement').value;if(target!=='uncategorized'&&!categoryItem(target)){toast('Choose an available replacement category.','error');return}const previous=getDesign(state.editor?.design.id),stamp=now(),designs=state.desi function mergeCategoryCatalogs(current,incoming){const map=new Map(current.map(c=>[c.id,c])),names=new Set(current.map(c=>c.name.toLocaleLowerCase()));for(const c of incoming)if(!map.has(c.id)){let name=c.name,n=2;while(names.has(name.toLocaleLowerCase()))name=`${c.name.slice(0,32)} (${n++})`;map.set(c.id,{...c,name});names.add(name.toLocaleLowerCase())}if(map.size>80)throw Error('Merging would exceed the 80-category limit. Remove unused categories or restore the backup instead.');return [...map.values()]}

function saveRunNeedle(el){if(!saveInlineNotes())return;const original=getDesign();if(!original)return;const no=Number(el.dataset.runNeedle),fid=selectedFabricId(original),old=effectiveNeedles(original,fid).find(n=>n.no===no);if(!old)return;const value=el.value===''?null:Number(el.value);if(value!==null&&(!Number.isInteger(value)||value<1||value>machineCapacity())){el.value=old.assignedNeedleNo??'';toast('Choose an available physical needle, or leave the optional reference blank.','error');return}const d=clone(original);writeFabricNeedle(d,fid,no,{assignedNeedleNo:value});d.updatedAt=now();let normalized;try{normalized=normalizeDesign(d)}catch(err){el.value=old.assignedNeedleNo??'';toast(err.message,'error');return}if(!persistPatch({designs:state.designs.map(x=>x.id===d.id?normalized:x)})){el.value=old.assignedNeedleNo??'';return}if(!state.runMapOpen)state.runMapOpen=Object.create(null);state.runMapOpen[d.id]=true;render(true);toast(saveText(ft('Optional needle reference saved. Thread colors are unchanged.','वैकल्पिक सुई संदर्भ सहेजा गया। धागे के रंग नहीं बदले।','Optional needle reference save ho gayi. Thread colors same hain.')))}
function colorFirstPanel(d){const all=effectiveNeedles(d),activeRows=all.filter(n=>n.isActive),list=state.showUnused[d.id]?all:activeRows,selected=getSelectedVariant(d);return `${productionSetupSummary(d)}<div class="panel-heading"><div><h2>${e(t('threadColors'))}</h2><p>${selected?e(selected.fabricName)+' · ':''}${activeRows.length} ${e(ft('design colors. No fixed needle required.','डिज़ाइन रंग। तय सुई ज़रूरी नहीं।','design colors. Fixed needle zaroori nahi.'))}</p></div><span class="pill colorful-pill">${icon('palette','icon-sm')}${activeRows.length} ${e(t('colors'))}</span></div><div class="needle-list color-first-list">${list.map((n,i)=>`<div class="needle-row color-first-row ${n.isKapdaNeedle?'kapda':''} ${n.isOverridden?'overridden':''} ${!n.isActive?'inactive':''} ${n.assignedNeedleNo>machineCapacity()?'outside-machine':''}" style="--thread-color:${n.colorHex};--thread-rgb:${colorRGB(n.colorHex)}"><div class="needle-no color-sequence">${needleLabel(i+1)}<small>${e(ft('COLOR','रंग','COLOR'))}</small></div><span class="thread-swatch" style="background-color:${n.colorHex}" role="img" aria-label="${e(n.colorName||n.colorHex)} swatch"></span><div class="thread-main"><div class="thread-name">${e(n.colorName||ft('Unnamed color','रंग का नाम नहीं','Color ka naam nahi'))}</div><div class="thread-code">${e(n.colorCode||ft('Code optional','कोड वैकल्पिक','Code optional'))}</div>${n.assignedNeedleNo?`<div class="saved-needle-caption">${icon('needle','icon-sm')}${setupNo(n.assignedNeedleNo)} · ${e(ft('optional run reference','वैकल्पिक रन संदर्भ','optional run reference'))}</div>`:''}</div><div class="needle-badges">${n.assignedNeedleNo>machineCapacity()?`<span class="pill amber">OUTSIDE</span>`:''}${!n.isActive?`<span class="pill">${e(t('unused'))}</span>`:n.isOverridden?`<span class="pill sky">${icon('edit','icon-sm')}VARIANT</span>`:''}${n.isKapdaNeedle?`<span class="pill amber">KAPDA</span>`:''}</div></div>`).join('')}</div>${all.length>activeRows.length?`<button class="btn btn-outline btn-sm unused-needle-toggle" data-action="toggle-unused">${icon(state.showUnused[d.id]?'minus':'plus','icon-sm')}${e(unusedNeedleToggleLabel(d,all,activeRows.length))}</button>`:''}${runNeedleReferences(d,activeRows)}<div class="setup-footnote">${icon('info')}${e(ft('The design stores thread colors, not a permanent needle layout. Park and Kapda are separate physical setup references. Verify the actual thread loading before every run.','डिज़ाइन में धागे के रंग सेव होते हैं, स्थायी सुई लेआउट नहीं। पार्क व कपड़ा अलग मशीन संदर्भ हैं। हर रन से पहले धागे जाँचें।','Design mein thread colors save hote hain, permanent needle layout nahi. Park / Kapda alag machine references hain. Har run se pehle actual thread check karein.'))}</div>`}
function compactRangeSpan(h){return `<div class="range-span-only"><span>${icon('frame','icon-sm')}${e(ft('Range span','रेंज की लंबाई','Range span'))}</span><strong>${fmt(num(h.xMax)-num(h.xMin))}<small> mm</small></strong></div>`}
function compactRangeSummary(h){return `<div class="compact-range-readout"><div><span>${e(ft('FROM','शुरू','FROM'))}</span><strong>${fmt(h.xMin)}<small> mm</small></strong></div><div class="range-readout-arrow">${icon('arrow')}</div><div><span>${e(ft('TO','अंत','TO'))}</span><strong>${fmt(h.xMax)}<small> mm</small></strong></div><span class="range-span-pill">${fmt(num(h.xMax)-num(h.xMin))} mm ${e(ft('span','रेंज','span'))}</span></div>`}
function rangeAdvancedFields(h){return `<div class="range-advanced-content"><p class="field-hint">${e(ft('Optional frame references. You can ignore this section for a normal range-only setup. Previously saved values are kept.','वैकल्पिक फ्रेम संदर्भ। सामान्य सेटअप में केवल ऊपर की रेंज काफ़ी है। पुराने मान सुरक्षित हैं।','Optional frame references. Normal setup mein sirf upar ki range kaafi hai. Purane saved values safe hain.'))}</p><div class="form-grid">${[['yMin','Y Min'],['yMax','Y Max']].map(([field,label])=>`<div class="form-field"><label class="field-label" for="home-${field}">${label} · mm</label><input type="number" id="home-${field}" data-home="${field}" value="${e(h[field])}" step="any" min="-100000" max="100000"></div>`).join('')}<div class="form-field full"><label class="field-label" for="hoop-size">${e(t('hoop'))}</label><select id="hoop-size" data-home="hoopSize">${[['100x100','100 × 100 mm'],['130x180','130 × 180 mm'],['200x200','200 × 200 mm'],['360x360','360 × 360 mm'],['custom',t('custom')]].map(([v,label])=>`<option value="${v}" ${h.hoopSize===v?'selected':''}>${e(label)}</option>`).join('')}</select></div>${h.hoopSize==='custom'?`<div class="form-field"><label class="field-label" for="custom-hoop-width">Custom width · mm</label><input type="number" id="custom-hoop-width" data-home="customHoopWidth" value="${h.customHoopWidth??200}" min="1" max="5000" step="any"></div><div class="form-field"><label class="field-label" for="custom-hoop-height">Custom height · mm</label><input type="number" id="custom-hoop-height" data-home="customHoopHeight" value="${h.customHoopHeight??200}" min="1" max="5000" step="any"></div>`:''}</div><div class="auto-center-toggle"><div><span class="field-label" style="margin-bottom:4px">Auto-calculate center</span><span class="muted">Optional manual center reference.</span></div><label class="switch"><input type="checkbox" id="auto-center" ${h.autoCenter!==false?'checked':''} aria-label="Automatically calculate home center"><span class="switch-track"></span></label></div><div class="form-grid">${[['centerX','Center X'],['centerY','Center Y']].map(([field,label])=>`<div class="form-field"><label class="field-label" for="home-${field}">${label} · mm</label><input type="number" id="home-${field}" data-home="${field}" value="${e(h[field])}" step="any" ${h.autoCenter!==false?'readonly aria-readonly="true"':''}></div>`).join('')}<div class="form-field full"><label class="field-label" for="frame-notes">${e(t('frameNotes'))}</label><textarea id="frame-notes" data-home="notes" maxlength="40000" placeholder="Optional positioning notes…">${e(h.notes)}</textarea></div></div><div id="home-range-warning">${homeWarning(h)}</div></div>`}
function rangeOnlyEditor(ed){const h=ed.design.homeSet;return `${stepHeading(ed,ft('Just the start and end range. Nothing else is required here.','सिर्फ़ शुरुआत और अंत की रेंज भरें। यहाँ और कुछ ज़रूरी नहीं है।','Sirf start aur end range bharein. Yahan aur kuch zaroori nahi.'))}<div class="range-only-card"><div class="range-only-label">${icon('frame','icon-sm')}HOME SET · X RANGE</div><div class="range-only-inputs">${[['xMin',ft('Range from','रेंज शुरू','Range se')],['xMax',ft('Range to','रेंज अंत','Range tak')]].map(([field,label])=>`<div class="form-field"><label class="field-label" for="home-${field}">${e(label)} <span class="muted">· mm</span></label><input type="number" id="home-${field}" data-home="${field}" value="${e(h[field])}" step="any" min="-100000" max="100000" inputmode="decimal" required></div>`).join('')}</div><div id="range-readout">${compactRangeSpan(h)}</div></div><div class="range-card-note">${icon('grid','icon-sm')}${e(ft('This range is also visible directly on the design card.','यह रेंज डिज़ाइन कार्ड पर भी सीधे दिखेगी।','Yeh range design card par bhi seedhe dikhegi.'))}</div><details class="range-advanced" id="range-advanced" ${ed.homeAdvanced?'open':''}><summary>${icon('settings','icon-sm')}${e(ft('More frame references','और फ्रेम संदर्भ','More frame references'))}<small>${e(ft('OPTIONAL','वैकल्पिक','OPTIONAL'))}</small>${icon('down','icon-sm')}</summary>${rangeAdvancedFields(h)}</details>`}
function rangeOnlyPanel(d){const h=d.homeSet;return `<div class="panel-heading"><div><h2>${e(t('homeSet'))}</h2><p>${e(ft('A compact range reference — also on the design card.','छोटी-सी रेंज जानकारी — डिज़ाइन कार्ड पर भी।','Compact range reference — design card par bhi.'))}</p></div><button class="btn btn-outline btn-sm" data-action="edit-home" data-id="${e(d.id)}">${icon('edit','icon-sm')}${e(t('edit'))}</button></div><div class="range-only-card production-range-card">${compactRangeSummary(h)}</div>${h.notes?`<div class="range-notes"><strong>${e(t('frameNotes'))}</strong><p>${e(h.notes)}</p></div>`:''}<details class="range-advanced"><summary>${icon('settings','icon-sm')}${e(ft('Saved frame references','सेव फ्रेम संदर्भ','Saved frame references'))}<small>${e(ft('OPTIONAL','वैकल्पिक','OPTIONAL'))}</small>${icon('down','icon-sm')}</summary><div class="range-advanced-content"><div class="saved-frame-facts"><div><span>Y range</span><b>${fmt(h.yMin)} → ${fmt(h.yMax)} mm</b></div><div><span>${e(t('center'))} X / Y</span><b>${fmt(h.centerX)} / ${fmt(h.centerY)} mm</b></div><div><span>${e(t('hoop'))}</span><b>${e(hoopLabel(h))}</b></div></div>${homeWarning(h)}<div class="frame-diagram optional-frame-diagram">${renderFrame(h)}</div></div></details>`}
function rangeOnDesignCard(d){return `<div class="card-home-range"><span>${icon('frame','icon-sm')}${e(ft('HOME RANGE','होम रेंज','HOME RANGE'))}</span><div><b>${fmt(d.homeSet.xMin)}</b>${icon('arrow','icon-sm')}<b>${fmt(d.homeSet.xMax)}</b><small>mm</small></div></div>`}

/* Optional platform adapters. The UI/data remain the same in every build. */
function nativeApp(){return globalThis.EmbroideryNative?.isNative===true}
function hostedApp(){return globalThis.EmbroideryBuild?.kind==='website'&&/^https?:$/.test(location.protocol)&&isSecureContext&&'serviceWorker'in navigator}
async function pickNativePhoto(source){try{const result=await globalThis.EmbroideryNative.selectPhoto(source);if(!result?.dataUrl)return;const blob=await(await fetch(result.dataUrl)).blob();await handlePhoto(new File([blob],'embroidery-reference.'+(result.format||'jpeg'),{type:blob.type||'image/jpeg'}))}catch(err){if(!/cancel|no image/i.test(err.message||''))toast('Photo could not open: '+err.message,'error')}}
function platformOfflineCard(){if(nativeApp())return `<section class="settings-card"><h2 class="settings-card-title">${icon('shield')}Android · offline ready</h2><p class="pwa-note">The app and reference photos are stored on this device. No server or login is needed. Export backups through the Android share sheet; import the same JSON on the website or another device.</p><div class="row wrap" style="gap:7px;margin-top:16px"><span class="pill">Native photo picker</span><span class="pill">Android print / PDF</span></div></section>`;if(hostedApp())return `<section class="settings-card"><h2 class="settings-card-title">${icon('install')}Install & offline</h2><p class="pwa-note">Open once online, then this website works offline. Install it from your browser for a full-screen workspace.</p><button class="btn btn-primary btn-sm" style="width:100%;margin-top:17px" data-action="install">${icon('download','icon-sm')}${e(t('install'))}</button><p class="field-hint" style="margin-top:12px">Moving to the Android app? Export a JSON backup and import it there. Data stays on each device.</p></section>`;return `<section class="settings-card"><h2 class="settings-card-title">${icon('install')}Install & offline</h2><p class="pwa-note">The saved HTML file runs fully offline, including its photos and fonts. No network resources are used.</p><button class="btn btn-primary btn-sm" style="width:100%;margin-top:17px" data-action="install">${icon('download','icon-sm')}${e(t('install'))}</button><details><summary>${icon('info','icon-sm')}About PWA installation</summary><p>A standards-compliant offline PWA needs HTTPS (or localhost) and a same-origin HTTP(S) JavaScript service worker URL. Browsers reject blob and data URLs for service workers. That cannot be guaranteed by a single HTML file.</p><p style="margin-top:10px">An embedded manifest and cache-first worker source are included. The inline blob registration is attempted on secure hosts, with an honest fallback. The application itself never depends on that registration. For reliable hosted-PWA installation, serve the embedded worker as <span class="mono">embroideryguide-sw.js</span> beside this file.</p><button class="btn btn-outline btn-sm" style="margin-top:14px" data-action="download-worker">Download embedded host worker</button><p style="margin-top:8px">Optional deployment helper only. The single-file app needs no companion file for ordinary offline use.</p></details></section>`}
let nativeBackTime=0;
document.addEventListener('embroidery-native-back',async()=>{if(!nativeApp())return;if(currentModal){if(currentModal.closable)closeModal();return}if(!saveInlineNotes())return;if(state.route.view==='editor'){await runAction('editor-cancel',{dataset:{}});return}if(state.route.view!=='designs'){go('/designs');return}if(state.library.query||state.library.category!=='all'||state.library.favorites){state.library={...state.library,query:'',category:'all',favorites:false};render(true);return}if(Date.now()-nativeBackTime<1800){await globalThis.EmbroideryNative.exit();return}nativeBackTime=Date.now();toast(ft('Press back again to close.','बंद करने के लिए फिर बैक दबाएँ।','Band karne ke liye phir back dabayein.'))});
document.addEventListener('embroidery-native-pause',()=>saveInlineNotes());
if(nativeApp())document.body.classList.add('native-app');

function designMenu(id){const d=getDesign(id);if(!d)return;openModal({title:d.name,className:'sheet',body:`<p class="modal-description mono" style="margin-top:-7px;margin-bottom:13px">${e(d.code)} · ${e(categoryName(d.category))}</p><div class="context-list"><button class="context-item" data-modal="edit">${icon('edit')}${e(t('edit'))}</button><button class="context-item" data-modal="duplicate">${icon('duplicate')}${e(t('duplicate'))}</button><button class="context-item" data-modal="favorite">${icon('star')}${d.isFavorite?'Remove favorite':e(t('favorite'))}</button><div class="divider" style="margin:7px 0"></div><button class="context-item danger" data-modal="delete">${icon('trash')}${e(t('delete'))}</button></div>`,actions:{edit:()=>{closeModal();go(`/design/${encodeURIComponent(id)}/edit`)},duplicate:()=>{closeModal();duplicateDesign(id)},favorite:()=>{closeModal();toggleFavorite(id)},delete:()=>{closeModal();deleteDesign(id)}}})}
function toggleFavorite(id){const d=getDesign(id);if(!d)return;const next={...d,isFavorite:!d.isFavorite,updatedAt:now()};if(!persistPatch({designs:state.designs.map(x=>x.id===id?next:x)}))return;render(true);toast(saveText(next.isFavorite?'Added to favorites.':'Removed from favorites.'))}
function duplicateDesign(id){const d=getDesign(id);if(!d)return;const copy=clone(d);copy.id=uuid();copy.name=`${d.name.slice(0,190)} (copy)`;copy.code=uniqueCode(d.code);copy.isFavorite=false;copy.createdAt=copy.updatedAt=now();const variantIds=new Map();copy.fabricVariants.forEach(v=>{const old=v.id;v.id=uuid();variantIds.set(old,v.id)});copy.baseFabricId=variantIds.get(copy.baseFabricId)||copy.fabricVariants[0]?.id||null;copy.activeFabricId=variantIds.get(copy.activeFabricId)||copy.baseFabricId;if(!persistPatch({designs:[copy,...state.designs]}))return;toast(saveText(`Design duplicated as ${copy.code}.`));go(`/design/${encodeURIComponent(copy.id)}`)}
async function deleteDesign(id){const d=getDesign(id);if(!d)return;if(!await confirmDialog('Delete this design?',`“${d.name}” (${d.code}) will be removed from this device. A brief Undo will be available after deletion.`,'Delete design',true))return;const index=state.designs.findIndex(x=>x.id===id);if(!persistPatch({designs:state.designs.filter(x=>x.id!==id)}))return;if(state.route.id===id)go('/designs',true);else render(true);toast(saveText('Design deleted.'),'success',{label:t('undo'),run:()=>{if(state.designs.some(x=>x.id===d.id)){toast('This design has already been restored.');return}const restored=clone(d);if(state.designs.some(x=>x.code.toLowerCase()===restored.code.toLowerCase()))restored.code=uniqueCode(restored.code);const list=[...state.designs];list.splice(Math.min(index,list.length),0,restored);if(persistPatch({designs:list})){render(true);toast(saveText('Design restored.'))}}})}
function selectVariant(id){if(!saveInlineNotes())return;const d=getDesign();if(!d)return;const next=id==='base'?null:id;if(next!==null&&!d.fabricVariants.some(v=>v.id===next))return;if(!persistPatch({designs:state.designs.map(x=>x.id===d.id?{...x,activeFabricId:next}:x)}))return;state.variants[d.id]=next;render(true)}
function selectDetailTab(index,focus=false){if(!saveInlineNotes())return;const d=getDesign();if(!d)return;state.detailTabs[d.id]=Math.max(0,Math.min(4,index));const y=window.scrollY;const tab=state.detailTabs[d.id];for(const [i,button] of $$('.detail-tab').entries()){button.classList.toggle('active',i===tab);button.setAttribute('aria-selected',String(i===tab));button.tabIndex=i===tab?0:-1}const panel=$('#detail-panel');if(panel){panel.innerHTML=detailTabContent(d,tab);panel.setAttribute('aria-labelledby',`detail-tab-${tab}`);panel.style.animation='none';void panel.offsetWidth;panel.style.animation='';}if(focus)$(`#detail-tab-${tab}`)?.focus({preventScroll:true});$(`#detail-tab-${tab}`)?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});window.scrollTo({top:y,behavior:'instant'})}
function saveInlineNotes(){const field=$('#inline-notes');if(!field)return true;const d=getDesign(field.dataset.id);if(!d||d.notes===field.value)return true;const updated={...d,notes:field.value,updatedAt:now()};const status=$('#notes-save-status');const ok=persistPatch({designs:state.designs.map(x=>x.id===d.id?updated:x)});if(status&&(ok||!status.querySelector('[data-action="rescue-notes"]')))status.innerHTML=ok?`${icon('check','icon-sm')}${state.storageAvailable?`Saved ${e(date(updated.updatedAt,true))}`:'Saved for this session only — export a backup.'}`:`${icon('warning','icon-sm')}<span>Not saved. Your text is still here.</span><button class="btn btn-sm btn-outline" data-action="rescue-notes">${icon('download','icon-sm')}Download unsaved note</button><button class="btn btn-sm btn-ghost" data-action="discard-note">Discard this edit</button>`;if(ok)toast(saveText('Notes saved.'));return ok}
function addNote(id){const d=getDesign(id);if(!d)return;openModal({title:t('addNote'),kind:'note',body:`<p class="modal-description">Add a dated observation for <strong>${e(d.name)}</strong>. Entries are saved on this device.</p><label class="field-label" for="log-entry">Production note</label><textarea id="log-entry" style="width:100%;min-height:145px" maxlength="10000" placeholder="Setup change, quality check or handover for the next operator…" autofocus></textarea><p id="note-error" class="field-error" role="alert"></p><p class="field-hint">${e(date(now(),true))} · Ctrl / ⌘ + Enter to save</p>`,footer:`<button class="btn btn-outline" data-modal="close">${e(t('cancel'))}</button><button class="btn btn-primary" data-modal="save">${icon('plus','icon-sm')}Add dated note</button>`,actions:{save:()=>{const text=$('#log-entry').value.trim();if(!text){$('#note-error').textContent='Enter a note before saving.';$('#log-entry').focus();return}const latest=getDesign(id);if(!latest){toast('This design no longer exists.','error');closeModal();return}const update={...latest,noteLog:[...latest.noteLog,{date:now(),text}],updatedAt:now()};if(persistPatch({designs:state.designs.map(x=>x.id===id?update:x)})){closeModal();render(true);toast(saveText('Dated production note added.'))}}}})}
function designSummary(d){const v=getSelectedVariant(d),h=d.homeSet,m=d.machineSettings;return `EMBROIDERYGUIDE · PRODUCTION REFERENCE\n${d.name} · ${d.code}\nCategory: ${categoryName(d.category)}\nMachine: ${state.settings.machineName} · ${machineCapacity()} physical needles / head\n${machineConflictList(d).length?`CAUTION: Outside configured machine range: ${machineConflictList(d).join(', ')}. Review before running.\n`:''}Stitches: ${d.stitchCount?fmt(d.stitchCount):'Not set'}\nParked needle: ${setupNo(d.setupNeedles?.parkedNeedleNo)}\nKapda attachment needle: ${setupNo(d.setupNeedles?.kapdaNeedleNo)}\nFabric: ${v?v.fabricName:'Base setup'}\n\nTHREAD COLORS · रंग\n${effectiveNeedles(d).filter(n=>n.isActive).map((n,i)=>`Color ${needleLabel(i+1)} · ${n.colorName||'Unnamed'} · ${n.colorCode||'Code optional'}${n.assignedNeedleNo?' · Optional run needle: '+setupNo(n.assignedNeedleNo):' · Needle not fixed'}${n.isKapdaNeedle?' · KAPDA':''}`).join('\n')}\nColors are design references. Actual needles can change on every run.\n\nHOME RANGE (mm)\n${h.xMin} → ${h.xMax} · span ${h.xMax-h.xMin} mm\nOptional frame references: Y ${h.yMin} to ${h.yMax}; center ${h.centerX}, ${h.centerY}; hoop ${hoopLabel(h)}\n${h.notes}\n\nMACHINE SETTINGS\nSpeed: ${m.speed} RPM\nDensity / pull compensation: ${m.density.toFixed(2)}\nUnderlay: ${UNDERLAYS[m.underlay]}\nTrim on change: ${m.trimOnChange?'Yes':'No'}\n${m.machineType==='multiHead'?`Multi head · ${m.headCount} heads`:'Single head'}\n\nNOTES\n${d.notes||'No notes'}\n\nReference only. Verify the stitch file and machine limits before production.`}
function backupData(designs=state.designs,colors=state.colors,settings=state.settings){return{format:'EmbroideryGuide',version:1,appVersion:VERSION,exportedAt:now(),designs:clone(designs),colors:clone(colors),settings:clone(settings)}}
async function exportOne(id){const d=getDesign(id);if(!d)return;const filename=`EmbroideryGuide-${d.code.replace(/[^a-z\d_-]/gi,'-')}.json`;if(await downloadFile(filename,JSON.stringify(backupData([d],[],state.settings),null,2)))toast('Design JSON prepared for download.')}
async function shareDesign(id){const d=getDesign(id);if(!d)return;if(nativeApp()){await exportOne(id);return}const text=designSummary(d),json=JSON.stringify(backupData([d],[],state.settings),null,2);if(navigator.share){try{const file=new File([json],`EmbroideryGuide-${d.code.replace(/[^a-z\d_-]/gi,'-')}.json`,{type:'application/json'});if(navigator.canShare?.({files:[file]})){await navigator.share({title:`${d.name} · ${d.code}`,text:`${d.name} · ${d.code} · EmbroideryGuide setup backup`,files:[file]});return}await navigator.share({title:`${d.name} · ${d.code}`,text});return}catch(err){if(err.name==='AbortError')return}}
 openModal({title:'Share this setup',body:`<div class="modal-badge-icon">${icon('share')}</div><p class="modal-description">Share a readable setup summary, or send a complete JSON design file with its photo and fabric variants. The receiving operator can import that file into EmbroideryGuide.</p><div class="inline-notice"><strong>${e(d.name)}</strong><br>${e(d.code)} · ${runningNeedles(d).length} colors · ${e(stitchesText(d))} · ${d.fabricVariants.length} fabrics</div>`,footer:'<button class="btn btn-outline" data-modal="copy">'+icon('duplicate','icon-sm')+'Copy summary</button><button class="btn btn-primary" data-modal="download">'+icon('download','icon-sm')+'Design JSON</button>',actions:{copy:()=>{closeModal();copyText(text)},download:async()=>{await exportOne(id);closeModal()}}})}
function renderPrint(d){const v=getSelectedVariant(d),h=d.homeSet,m=d.machineSettings,ns=effectiveNeedles(d).filter(n=>n.isActive),two=ns.length>16;const table=list=>`<table><colgroup><col style="width:10%"><col style="width:43%"><col style="width:20%"><col style="width:27%"></colgroup><thead><tr><th>Color</th><th>Thread color</th><th>Code</th><th>Run needle*</th></tr></thead><tbody>${list.map(n=>`<tr class="${n.isKapdaNeedle?'kapda-print':''}"><td><strong>${needleLabel(ns.indexOf(n)+1)}</strong></td><td><span class="print-dot" style="background:${n.colorHex}"></span>${e(n.colorName||'Unnamed')}${n.isOverridden?' <small>VAR</small>':''}</td><td>${e(n.colorCode||'—')}</td><td>${n.assignedNeedleNo?setupNo(n.assignedNeedleNo)+(n.isKapdaNeedle?' · KAPDA':''):'Not fixed'}</td></tr>`).join('')}</tbody></table>`;const halves=two?[ns.slice(0,Math.ceil(ns.length/2)),ns.slice(Math.ceil(ns.length/2))]:[ns];$('#print-root').classList.toggle('dense',ns.length>32);$('#print-root').innerHTML=`<div class="print-header"><div><div class="print-brand">EMBROIDERYGUIDE / OPERATOR COLOR REFERENCE</div><h1>${e(d.name)}</h1><p><strong>${e(d.code)}</strong> · ${e(categoryName(d.category))}<br>Fabric: <strong>${e(v?v.fabricName:'Base setup')}</strong> · ${ns.length} thread colors · ${machineCapacity()} physical needles / head<br><strong>${e(stitchesText(d))}</strong> · Park ${setupNo(d.setupNeedles?.parkedNeedleNo)} · Kapda ${setupNo(d.setupNeedles?.kapdaNeedleNo)}<br>Updated ${e(date(d.updatedAt,true))}</p></div>${photoSafe(d.photoBase64)?`<img src="${d.photoBase64}" alt="Design reference">`:''}</div>${machineConflictList(d).length?`<p class="print-warning">CAUTION: ${e(machineConflictList(d).join(', '))} outside this ${machineCapacity()}-needle machine. Saved references are preserved; review before running.</p>`:''}<h2 class="print-section-title">Thread colors · रंग</h2><div class="print-tables ${two?'two':''}">${halves.map(table).join('')}</div><p class="print-reference-legend">* Optional
