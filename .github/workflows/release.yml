name: Website + signed Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: embroidery-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Test one source + build website
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - name: Static safety, operator workflows, responsive and platform tests
        run: npm run test:ci
      - id: metadata
        name: Read app version
        run: |
          node -e 'require("fs").appendFileSync(process.env.GITHUB_OUTPUT,"version="+require("./package.json").version+"\n")'
      - name: Pack portable website
        run: (cd dist/web && zip -qr ../EmbroideryGuide-website.zip .)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist/web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-downloads
          path: |
            dist/EmbroideryGuide.html
            dist/EmbroideryGuide-website.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Build + verify stable-signed APK
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci --no-audit --no-fund
      - name: Install the Android SDK used by the project
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Require the persistent release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.EG_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.EG_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EG_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.EG_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Set all four EG_ANDROID_* release-signing secrets. See docs/BUILD.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/embroideryguide-release.jks"
          chmod 600 "$RUNNER_TEMP/embroideryguide-release.jks"
      - name: Bundle exactly the same UI into Android
        run: npm run android:sync
      - name: Compile, unit-check and lint release APK
        working-directory: android
        env:
          EG_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/embroideryguide-release.jks
          EG_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.EG_ANDROID_KEYSTORE_PASSWORD }}
          EG_ANDROID_KEY_ALIAS: ${{ secrets.EG_ANDROID_KEY_ALIAS }}
          EG_ANDROID_KEY_PASSWORD: ${{ secrets.EG_ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease testReleaseUnitTest assembleDebugAndroidTest lintRelease
      - name: Verify APK signature and package
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/EmbroideryGuide.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/EmbroideryGuide.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging artifacts/EmbroideryGuide.apk | sed -n '1,4p'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-downloads
          path: artifacts/EmbroideryGuide.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-quality-reports
          path: |
            android/app/build/reports/lint-results-release.html
            android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/embroideryguide-release.jks"

  deploy:
    name: Deploy verified website to Pages
    needs: [verify, android]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  publish:
    name: Publish APK + HTML + website downloads
    needs: [verify, android, deploy]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '*-downloads'
          merge-multiple: true
          path: artifacts
      - name: Publish a release with checksums
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.verify.outputs.version }}
        run: node scripts/publish.mjs
